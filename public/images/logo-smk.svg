<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <!-- Shield outline -->
  <path d="M100 5 L185 35 L185 110 Q185 175 100 225 Q15 175 15 110 L15 35 Z"
        fill="#2d7a2d" stroke="#1a5c1a" stroke-width="3"/>
  <!-- Inner shield yellow border -->
  <path d="M100 18 L172 44 L172 110 Q172 165 100 210 Q28 165 28 110 L28 44 Z"
        fill="none" stroke="#f5c518" stroke-width="4"/>
  <!-- Inner shield fill -->
  <path d="M100 22 L168 47 L168 110 Q168 162 100 206 Q32 162 32 110 L32 47 Z"
        fill="#5cb85c"/>

  <!-- Gear (red) -->
  <circle cx="100" cy="120" r="38" fill="#cc0000"/>
  <circle cx="100" cy="120" r="28" fill="#f5c518"/>
  <!-- Gear teeth -->
  <g fill="#cc0000">
    <rect x="95" y="78" width="10" height="12" rx="2"/>
    <rect x="95" y="150" width="10" height="12" rx="2"/>
    <rect x="62" y="115" width="12" height="10" rx="2"/>
    <rect x="126" y="115" width="12" height="10" rx="2"/>
    <rect transform="rotate(45,100,120)" x="95" y="78" width="10" height="12" rx="2"/>
    <rect transform="rotate(45,100,120)" x="95" y="150" width="10" height="12" rx="2"/>
    <rect transform="rotate(45,100,120)" x="62" y="115" width="12" height="10" rx="2"/>
    <rect transform="rotate(45,100,120)" x="126" y="115" width="12" height="10" rx="2"/>
  </g>

  <!-- Sun rays (yellow) -->
  <circle cx="100" cy="120" r="18" fill="#f5c518"/>
  <!-- Center circle (muhammadiyah symbol) -->
  <circle cx="100" cy="120" r="12" fill="#cc0000"/>
  <text x="100" y="125" font-family="serif" font-size="14" fill="#f5c518" text-anchor="middle" font-weight="bold">م</text>

  <!-- Banner/ribbon -->
  <path d="M55 138 Q100 148 145 138 L148 148 Q100 160 52 148 Z" fill="#1a7a3a" stroke="#f5c518" stroke-width="1"/>
  <text x="100" y="157" font-family="Arial" font-size="7" fill="white" text-anchor="middle" font-weight="bold">Mandiri-Unggul-Disiplin-Agamis</text>

  <!-- Top text: SMK MUHAMMADIYAH 4 -->
  <text x="100" y="48" font-family="Arial" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">SMK MUHAMMADIYAH 4</text>
  <text x="100" y="62" font-family="Arial" font-size="9" fill="#1a1a1a" text-anchor="middle">DAUN - SANGKAPURA</text>

  <!-- Bottom text: SMK MUDA -->
  <text x="100" y="200" font-family="Arial" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="900">SMK MUDA</text>
</svg>
